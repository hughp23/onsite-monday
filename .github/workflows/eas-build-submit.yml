name: EAS Build & Submit

# Triggered by version tags (e.g. v1.2.0).
# Builds a production Android .aab and submits to Google Play internal track.
#
# Before first run:
#   1. Set EXPO_TOKEN in GitHub → Settings → Secrets and variables → Actions
#   2. Set EXPO_PUBLIC_* production env vars as EAS secrets (already done)
#   3. Add google-play-service-account.json as an EAS secret or commit it (gitignored)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-submit:
    name: Build and submit to stores
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: npm ci

      - name: Build for Android
        run: eas build --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Submit to Google Play
        run: eas submit --platform android --profile production --non-interactive
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
